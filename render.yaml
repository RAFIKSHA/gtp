services:
  - type: web
    name: codexpetra-gate-backend
    env: python
    region: singapore # or nearest region to Mumbai (ap-south-1)
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,gate.codexpetra.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://gate.codexpetra.com,https://codexpetra.com"
      - key: DATABASE_URL
        sync: false # Set in Render dashboard using Supabase IPv4 Pooler connection string

